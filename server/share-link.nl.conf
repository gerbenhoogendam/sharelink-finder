# nginx-configuratie voor share-link.nl op de eigen server.
# Bestanden: de inhoud van docs/ uit de repo in /var/www/share-link.nl.
#
# Volgorde:
#   1. rsync -av --delete docs/ gebruiker@titan.itghosting.nl:/var/www/share-link.nl/
#   2. dit bestand naar /etc/nginx/sites-available/share-link.nl, symlink in sites-enabled, nginx -t, reload
#   3. certbot certonly --webroot -w /var/www/share-link.nl -d share-link.nl -d www.share-link.nl
#   4. nginx -s reload

# Poort 80: alleen de Let's Encrypt-challenge, al het andere naar https op de kale naam.
server {
    listen 80;
    listen [::]:80;
    server_name share-link.nl www.share-link.nl;

    location ^~ /.well-known/acme-challenge/ { root /var/www/share-link.nl; }
    location / { return 301 https://share-link.nl$request_uri; }
}

# www: altijd door naar de kale naam. Het deel achter het hekje stuurt de browser nooit mee
# en plakt hij na een 301 zelf weer achter het nieuwe adres, dus de link blijft heel.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.share-link.nl;

    ssl_certificate     /etc/letsencrypt/live/share-link.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share-link.nl/privkey.pem;

    return 301 https://share-link.nl$request_uri;
}

# De site zelf: statische bestanden, geen logboek.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name share-link.nl;

    ssl_certificate     /etc/letsencrypt/live/share-link.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/share-link.nl/privkey.pem;

    root  /var/www/share-link.nl;
    index index.html;

    access_log off;    # "er wordt niets gelogd": ook niet dat de pagina is geopend
    add_header Cache-Control "public, max-age=300";

    location / { try_files $uri $uri/ =404; }
}
