<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Bestand openen…</title>
<style>body{font:16px -apple-system,sans-serif;margin:3em;color:#333}</style>
</head>
<body>
<p id="msg">Bestand wordt lokaal geopend…</p>
<p><a id="retry" href="#">Werkt het niet? Klik hier.</a></p>
<script>
  const h = location.hash.slice(1);
  if (/^(file|folder)\/(dropbox|gdrive|synology|smb)\//.test(h)) {
    const target = 'sharelink://' + h;
    document.getElementById('retry').href = target;
    // Sluit het tabblad zodra de browser de focus verliest: dat is het moment dat Finder of de app naar voren komt.
    // Zo blijft de "mag deze pagina de app openen"-vraag staan tot er geklikt is. Browsers staan sluiten alleen toe
    // bij een tabblad dat door een externe link is geopend; anders blijft het staan.
    addEventListener('blur', () => window.close());
    location.href = target;
    setTimeout(() => window.close(), 10000);   // terugval als de focuswissel niet doorkomt
  } else {
    document.getElementById('msg').textContent = 'Ongeldige link.';
  }
</script>
<p style="color:#888;font-size:13px">Alleen voor Macs met Sharelink - Finder.</p>
</body>
</html>
